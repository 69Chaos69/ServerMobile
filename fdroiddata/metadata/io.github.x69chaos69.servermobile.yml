Summary: Share files over local HTTP, WebRTC, and BitTorrent
Description: |-
  Select a folder to share from an Android device. Serve files over HTTP on the
  local network, manually signaled WebRTC peer-to-peer connections, or
  BitTorrent discovery.

  The local HTTP server has no authentication or encryption. Devices on
  the same network can access shared files and upload files. BitTorrent
  magnets are public. Use these sharing features only with trusted
  networks and content.

